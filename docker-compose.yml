x-laravel: &laravel
  build: ./docker/php
  image: reelhouse-php
  restart: unless-stopped
  command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]

x-mysql-env: &mysql-env
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USERNAME: reelhouse
  DB_PASSWORD: reelhouse

services:

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: reelhouse-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - main-api
      - chat-service
      - chat-ws

  main-api:
    <<: *laravel
    environment:
      <<: *mysql-env
      SERVICE_NAME: main-api
      RUN_INSTALL: "true"
      APP_NAME: Reelhouse
      APP_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      DB_DATABASE: reelhouse
      CACHE_STORE: database
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: public
      PHP_CLI_SERVER_WORKERS: 8
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: hello@reelhouse.test
      MAIL_FROM_NAME: Reelhouse
      SENTIMENT_SERVICE_URL: http://sentiment-service:8000
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
    volumes:
      - ./services/main-api:/var/www/app
      - main_api_vendor:/var/www/app/vendor
    depends_on:
      mysql:
        condition: service_healthy
      sentiment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  sentiment-service:
    <<: *laravel
    environment:
      SERVICE_NAME: sentiment-service
      DB_CONNECTION: sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      PHP_CLI_SERVER_WORKERS: 4
    volumes:
      - ./services/sentiment-service:/var/www/app
      - sentiment_vendor:/var/www/app/vendor
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  chat-service:
    <<: *laravel
    environment: &chat-env
      <<: *mysql-env
      SERVICE_NAME: chat-service
      RUN_INSTALL: "true"
      DB_DATABASE: reelhouse_chat
      CACHE_STORE: database
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      PHP_CLI_SERVER_WORKERS: 8
      MAIN_API_URL: http://main-api:8000
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-reelhouse}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-reelhouse-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-reelhouse-secret}
      REVERB_HOST: chat-ws
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    volumes:
      - ./services/chat-service:/var/www/app
      - chat_vendor:/var/www/app/vendor
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  chat-ws:
    <<: *laravel
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment:
      <<: *chat-env
      SERVICE_NAME: chat-ws
      RUN_INSTALL: "false"
      SKIP_COMPOSER: "true"
    volumes:
      - ./services/chat-service:/var/www/app
      - chat_vendor:/var/www/app/vendor
    depends_on:
      chat-service:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reelhouse
      MYSQL_USER: reelhouse
      MYSQL_PASSWORD: reelhouse
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  mysql_data:
  main_api_vendor:
  sentiment_vendor:
  chat_vendor:
